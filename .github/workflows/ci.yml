name: Check website
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Analytics and collector contract checks
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile API
        run: dotnet build backend/Breach.Intel.Api --configuration Release

  collector:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install collector validation dependencies
        run: python -m pip install -r collector/requirements.txt
      - name: Collector integrity and queue tests
        run: python -m unittest discover -s collector/tests -v
